<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraSketch - Terraform構成図生成ツール</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5; color: #333; line-height: 1.6;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; margin-bottom: 20px; color: #1565c0; }
        .card {
            background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 24px; margin-bottom: 20px;
        }
        .card h2 { font-size: 1.1em; margin-bottom: 12px; color: #555; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 4px; }
        select, input[type="file"] {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;
        }
        .row { display: flex; gap: 16px; }
        .row > * { flex: 1; }
        .btn {
            display: inline-block; padding: 10px 24px; border: none; border-radius: 4px;
            font-size: 1em; cursor: pointer; color: #fff; background: #1565c0;
        }
        .btn:hover { background: #0d47a1; }
        .btn:disabled { background: #aaa; cursor: not-allowed; }
        .btn-download { background: #2e7d32; }
        .btn-download:hover { background: #1b5e20; }
        #status {
            margin-top: 12px; padding: 8px 12px; border-radius: 4px;
            display: none; font-size: 0.9em;
        }
        .status-ok { background: #c8e6c9; color: #1b5e20; display: block !important; }
        .status-err { background: #ffcdd2; color: #b71c1c; display: block !important; }
        .status-loading { background: #fff9c4; color: #f57f17; display: block !important; }
        #preview {
            margin-top: 16px; border: 1px solid #ddd; border-radius: 4px;
            padding: 16px; min-height: 200px; background: #fafafa;
            display: none; overflow: auto;
        }
        #actions { margin-top: 12px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TerraSketch</h1>
        <p style="text-align:center; margin-bottom:20px; color:#777;">
            Terraform state / HCL から構成図を自動生成
        </p>

        <div class="card">
            <h2>入力設定</h2>
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="file">Terraform State JSON / HCL ファイル</label>
                    <input type="file" id="file" name="file" accept=".json,.tf">
                </div>
                <div class="row">
                    <div class="form-group">
                        <label for="provider">プロバイダ</label>
                        <select id="provider" name="provider">
                            <option value="aws">AWS</option>
                            <option value="azure">Azure</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="format">出力形式</label>
                        <select id="format" name="format">
                            <option value="drawio">draw.io</option>
                            <option value="mermaid">Mermaid</option>
                            <option value="plantuml">PlantUML</option>
                            <option value="svg">SVG</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn" id="generateBtn">構成図を生成</button>
            </form>
            <div id="status"></div>
        </div>

        <div class="card" id="resultCard" style="display:none;">
            <h2>結果</h2>
            <div id="actions">
                <a id="downloadLink" class="btn btn-download" href="/download">ダウンロード</a>
            </div>
            <div id="preview"></div>
        </div>
    </div>

    <script type="module">
        // Mermaid CDN (ESM)
        let mermaidLoaded = false;

        async function loadMermaid() {
            if (mermaidLoaded) return;
            try {
                const mod = await import("https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs");
                mod.default.initialize({ startOnLoad: false, theme: "default" });
                window.mermaid = mod.default;
                mermaidLoaded = true;
            } catch (e) {
                console.warn("Mermaid CDN load failed:", e);
            }
        }

        const form = document.getElementById("uploadForm");
        const status = document.getElementById("status");
        const preview = document.getElementById("preview");
        const actions = document.getElementById("actions");
        const resultCard = document.getElementById("resultCard");
        const generateBtn = document.getElementById("generateBtn");

        function setStatus(msg, cls) {
            status.textContent = msg;
            status.className = cls;
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById("file");
            if (!fileInput.files.length) {
                setStatus("ファイルを選択してください。", "status-err");
                return;
            }

            const fd = new FormData();
            fd.append("file", fileInput.files[0]);
            fd.append("provider", document.getElementById("provider").value);
            fd.append("format", document.getElementById("format").value);

            setStatus("生成中...", "status-loading");
            generateBtn.disabled = true;
            resultCard.style.display = "none";

            try {
                const res = await fetch("/generate", { method: "POST", body: fd });
                const data = await res.json();

                if (!data.success) {
                    setStatus("エラー: " + data.error, "status-err");
                    return;
                }

                setStatus("生成完了: " + data.filename, "status-ok");
                resultCard.style.display = "block";
                actions.style.display = "block";

                if (data.format === "mermaid" && data.content) {
                    preview.style.display = "block";
                    await loadMermaid();
                    if (window.mermaid) {
                        preview.innerHTML = "";
                        const { svg } = await window.mermaid.render("mermaidPreview", data.content);
                        preview.innerHTML = svg;
                    } else {
                        preview.textContent = data.content;
                    }
                } else if (data.format === "svg" && data.content) {
                    preview.style.display = "block";
                    preview.innerHTML = data.content;
                } else {
                    preview.style.display = "none";
                }
            } catch (err) {
                setStatus("通信エラー: " + err.message, "status-err");
            } finally {
                generateBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
