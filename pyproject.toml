[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terrasketch"
version = "0.2.0"
description = "Terraform stateを唯一の信頼源として、AWS/Azure/GCPの構成図をdraw.io/Mermaid/PlantUML形式で自動生成するCLI/GUIツール"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Wada Masaya" },
]
keywords = ["terraform", "diagram", "draw.io", "mermaid", "plantuml", "aws", "azure", "gcp", "infrastructure"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

[project.urls]
Homepage = "https://github.com/wada-masaya/terrasketch"
Documentation = "https://wada-masaya.github.io/terrasketch/"
Repository = "https://github.com/wada-masaya/terrasketch"
Issues = "https://github.com/wada-masaya/terrasketch/issues"

[project.scripts]
terrasketch = "terrasketch.main:main"

[tool.setuptools.packages.find]
include = ["terrasketch*"]

[tool.setuptools.package-data]
terrasketch = ["web/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=terrasketch --cov-report=term-missing --cov-config=pyproject.toml"

[tool.coverage.run]
omit = [
    "terrasketch/gui/*",
]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py310"
line-length = 120

# プラグインシステムのエントリーポイントグループ定義（例）
