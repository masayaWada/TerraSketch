[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terrasketch"
version = "0.1.0"
description = "Terraform stateを唯一の信頼源として、AWS/Azureの構成図をdraw.io/Mermaid形式で自動生成するCLI/GUIツール"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
]

[project.scripts]
terrasketch = "terrasketch.main:main"

[tool.setuptools.packages.find]
include = ["terrasketch*"]

# プラグインシステムのエントリーポイントグループ定義（例）
# 外部プラグインは以下のグループに登録:
# [project.entry-points."terrasketch.renderers"]
# d2 = "terrasketch_d2:D2Renderer"
# [project.entry-points."terrasketch.mappings"]
# custom = "my_mappings:CUSTOM_MAPPING"
